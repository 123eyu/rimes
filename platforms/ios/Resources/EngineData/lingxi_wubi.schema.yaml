# Rime schema settings
# encoding: utf-8
#
# Imported from rime/rime-wubi revision
# 152a0d3f3efe40cae216d1e3b338242446848d07.
# Modified by RIMES: bundled full-pinyin reverse lookup with Wubi code hints.

schema:
  schema_id: lingxi_wubi
  name: "犀术五笔"
  version: "1.0.0"
  author:
    - 發明人 王永民先生
  description: |
    五筆字型86版＋全拼混合输入
    碼表源自 ibus-table
    直接输入五笔码或全拼，完整五笔码优先；z 可单独查拼音
    拼音候选括号内显示五笔编码
  dependencies:
    - rimes_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: rimes_wubi_manual_commit
    reset: 0
    states: [ 四码唯一上屏, 四码手动确认 ]
  - name: rimes_wubi_fifth_code
    reset: 0
    states: [ 第五码不顶字, 第五码顶字 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 常用, 增廣 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - lua_processor@*rimes_wubi_autocommit
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    - uniquifier

speller:
  delimiter: " ;'"
  #max_code_length: 4

abc_segmentor:
  extra_tags: [reverse_lookup]

translator:
  dictionary: wubi86
  prism: lingxi_wubi
  enable_charset_filter: true
  enable_user_dict: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 4
  disable_user_dict_for_patterns:
    - "^z.*$"

reverse_lookup:
  dictionary: pinyin_simp
  prism: rimes_pinyin
  strict_spelling: true
  prefix: "z"
  suffix: "'"
  tips: 〔拼音〕
  comment_format:
    - xform/^(.+)$/($1)/
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'

key_binder:

recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "^z[a-z]*'?$"
