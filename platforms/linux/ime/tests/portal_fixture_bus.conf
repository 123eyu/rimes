<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Isolated protocol/input test bus: never auto-activate the machine's real
     portal while testing service replacement or ordinary IM module input.
     In particular, do not mount a live document portal in a temporary runtime
     directory that the probe must remove before this bus exits. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
